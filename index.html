<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Sri Yantra Guidebook</title>
  <!-- GitHub Pages serves static files only, so there is no server-side 301.
       Meta refresh plus location.replace is the closest equivalent, and
       canonical points search engines at the destination. -->
  <meta http-equiv="refresh" content="0; url=https://mybook.to/sriyantra">
  <link rel="canonical" href="https://mybook.to/sriyantra">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="favicon.png">
  <script>
    // replace(), not assign(), so Back does not bounce the reader here again.
    window.location.replace('https://mybook.to/sriyantra');
  </script>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #060606; color: #f8f5f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      text-align: center; padding: 24px; line-height: 1.7;
    }
    a { color: #c9a96e; }
  </style>
</head>
<body>
  <p>Taking you to <a href="https://mybook.to/sriyantra">The Sri Yantra Guidebook on Amazon</a>.</p>
</body>
</html>
